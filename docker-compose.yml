version: "3.8"

services:
  mongodb:
    image: mongo:5.0
    container_name: mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: boncoinprojet-backend
    ports:
      - "8080:8080"
    environment:
      - MONGO_URL=mongodb://mongodb:27017/leboncoin
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
    container_name: boncoinprojet-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  registry:
    image: registry:2
    container_name: secure_registry
    ports:
      - "5000:5000"
    environment:
      - REGISTRY_AUTH=htpasswd
      - REGISTRY_AUTH_HTPASSWD_PATH=/auth/htpasswd
      - REGISTRY_AUTH_HTPASSWD_REALM="Docker Registry"
      - REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY=/var/lib/registry
    volumes:
      - ./auth:/auth
      - registry_data:/var/lib/registry


volumes:
  mongodb_data:
  registry_data:

