apiVersion: apps/v1
kind: Deployment
metadata:
  name: boncoin-mongo
  labels:
    app: boncoin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: boncoin
      tier: database
  template:
    metadata:
      labels:
        app: boncoin
        tier: database
    spec:
      containers:
      - name: mongo
        image: mongo:5.0
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: boncoin-mongo
spec:
  selector:
    app: boncoin
    tier: database
  ports:
  - protocol: TCP
    port: 27017
    targetPort: 27017
  type: ClusterIP
